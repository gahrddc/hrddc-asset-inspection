<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <title>ตรวจครุภัณฑ์ประจำปี</title>
  <script src="https://unpkg.com/html5-qrcode" defer></script>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;color:#17233b;background:#eef3f9}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#dbeafe 0,transparent 32%),#eef3f9}.hero{position:relative;overflow:hidden;padding:30px 20px 42px;color:#fff;background:linear-gradient(135deg,#12345f,#1d4ed8 68%,#3b82f6)}
    .hero:after{content:"";position:absolute;width:180px;height:180px;border:35px solid #ffffff18;border-radius:50%;right:-70px;top:-95px}.eyebrow{display:inline-block;margin-bottom:10px;padding:5px 10px;border:1px solid #ffffff45;border-radius:999px;background:#ffffff18;font-size:13px;font-weight:750}
    .hero h1{margin:0 0 5px;font-size:clamp(27px,6vw,38px);letter-spacing:-.4px}.hero p{margin:0;opacity:.9}.wrap{width:min(760px,100%);margin:-20px auto 0;padding:0 16px 28px;position:relative}
    .card{background:#fff;border:1px solid #e5ebf3;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 12px 34px #173b7014}.hidden{display:none!important}.section-title{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:18px}.step{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#e8f0ff;color:#1d4ed8;font-size:14px}
    label{display:block;font-weight:750;margin:0 0 7px}.field{margin-bottom:16px}input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:14px;font:inherit;background:#fff}
    textarea{min-height:82px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:800;cursor:pointer}
    .primary{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;box-shadow:0 8px 18px #2563eb35}.secondary{background:#eaf0fb;color:#173b70}.success{background:linear-gradient(135deg,#047857,#16a34a);color:#fff}.btn:disabled{opacity:.45}.msg{padding:13px 15px;border-radius:13px;background:#eef4ff;margin-top:12px}.msg.error{background:#fee2e2;color:#991b1b}
    #reader{margin-top:14px;border-radius:16px;overflow:hidden}#reader button{padding:11px 14px;border:0;border-radius:10px;font:inherit;font-weight:700}#reader video{border-radius:14px}
    .details{display:grid;grid-template-columns:130px 1fr;gap:9px 12px}.details dt{color:#64748b}.details dd{margin:0;font-weight:700;overflow-wrap:anywhere}.statuses{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .status{border:2px solid #dbe4f0;border-left:8px solid var(--c);background:#fff;border-radius:14px;padding:14px;text-align:left;font:inherit;font-weight:800}.status.selected{outline:3px solid #93c5fd;background:#eff6ff}
    .loader{pointer-events:none}.loader:after{content:"กำลังดำเนินการ…";position:fixed;inset:auto 20px 24px;background:#17233b;color:#fff;padding:14px;border-radius:14px;text-align:center;z-index:10}
    dialog{width:min(92vw,440px);border:0;border-radius:24px;padding:0;box-shadow:0 24px 70px #0f172a55}dialog::backdrop{background:#0f172a99;backdrop-filter:blur(3px)}.dialog-body{padding:24px}.camera-icon{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:#e8f0ff;font-size:32px}.dialog-body h2{text-align:center;margin:0 0 8px}.dialog-body p{color:#526078;line-height:1.6}.dialog-actions{display:grid;gap:9px;margin-top:18px}.privacy{font-size:13px;text-align:center;color:#718096}
    small{color:#64748b}@media(max-width:520px){.hero{padding-top:24px}.wrap{padding:0 12px 22px}.card{padding:17px}.details{grid-template-columns:1fr}.details dt{margin-top:5px}.statuses{grid-template-columns:1fr}.btn{width:100%}}
  </style>
</head>
<body>
  <header class="hero"><span class="eyebrow">กองบริหารทรัพยากรบุคคล</span><h1>ตรวจครุภัณฑ์ประจำปี</h1><p>รวดเร็ว • ตรวจซ้ำไม่ได้ • บันทึกผลทันที</p></header>
  <main class="wrap">
    <section class="card"><h2 class="section-title"><span class="step">1</span> ระบุผู้ตรวจ</h2>
      <div class="field"><label for="inspector">ชื่อผู้ตรวจ *</label><input id="inspector" autocomplete="name" placeholder="ชื่อ–นามสกุล"></div>
      <div id="roundMsg" class="msg">กำลังตรวจสอบรอบตรวจ…</div>
    </section>
    <section class="card"><h2 class="section-title"><span class="step">2</span> สแกนหรือค้นหาครุภัณฑ์</h2>
      <div class="actions"><button class="btn primary" id="scanBtn">📷 สแกน QR ครุภัณฑ์</button><button class="btn secondary" id="stopBtn" hidden>หยุดสแกน</button></div>
      <div id="reader" class="hidden"></div>
      <div class="field" style="margin-top:18px"><label for="query">หรือกรอก ID / เลขครุภัณฑ์</label><input id="query" placeholder="เช่น 1 หรือ 0402-001-0001"></div>
      <button class="btn secondary" id="findBtn">ค้นหา</button>
    </section>
    <section id="assetCard" class="card hidden">
      <h2>ข้อมูลครุภัณฑ์</h2><dl class="details">
        <dt>เลขครุภัณฑ์</dt><dd id="assetNo">-</dd><dt>รายการ</dt><dd id="assetName">-</dd><dt>ประเภท</dt><dd id="assetType">-</dd>
        <dt>สถานะต้นฉบับ</dt><dd id="sourceStatus">-</dd><dt>ผู้ครอบครองปัจจุบัน</dt><dd id="oldCustodian">-</dd><dt>กลุ่ม</dt><dd id="oldGroup">-</dd>
      </dl>
      <h2>ผลการตรวจ</h2><div id="statuses" class="statuses"></div>
      <div id="custodianFields" class="hidden" style="margin-top:16px"><div class="field"><label for="newCustodian">เปลี่ยนผู้ครอบครองเป็น</label><input id="newCustodian" placeholder="เว้นว่างหากไม่เปลี่ยน"></div><div class="field"><label for="newGroup">กลุ่มใหม่</label><input id="newGroup" placeholder="เว้นว่างหากไม่เปลี่ยน"></div></div>
      <div class="field" style="margin-top:16px"><label for="note">หมายเหตุ</label><textarea id="note"></textarea></div>
      <button class="btn success" id="saveBtn">บันทึกผลการตรวจ</button><div id="saveMsg" class="msg hidden"></div>
    </section>
  </main>
  <script>
    const API='https://script.google.com/macros/s/AKfycbxhL24fozA5cuxZTWmpm8qtCMlMSVJ2q1LoomGmOJ0h4vLfx3wi6rbYEmUbH3g_MOSyQg/exec';
    const $=id=>document.getElementById(id);let cfg=null,asset=null,selected=null,scanner=null,rawQr='';
    function msg(id,text,bad=false){const n=$(id);n.textContent=text;n.className='msg'+(bad?' error':'')}
    function busy(on){document.body.classList.toggle('loader',on)}
    function jsonp(params){return new Promise((resolve,reject)=>{const cb='__api'+Date.now()+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>finish(new Error('เชื่อมต่อระบบหลังบ้านไม่สำเร็จ')),20000);function finish(err,data){clearTimeout(timer);delete window[cb];s.remove();err?reject(err):resolve(data)}window[cb]=data=>finish(null,data);s.onerror=()=>finish(new Error('โหลดข้อมูลไม่สำเร็จ'));s.src=API+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.head.appendChild(s)})}
    async function api(params){const x=await jsonp(params);if(!x||x.ok===false)throw new Error(x&&x.error||'ระบบหลังบ้านตอบกลับไม่สำเร็จ');return x}
    async function loadConfig(){try{cfg=await api({api:'config'});msg('roundMsg','รอบที่เปิด: '+cfg.round.name+' ('+cfg.round.start+' – '+cfg.round.end+')')}catch(e){msg('roundMsg',e.message,true)}}
    function requireName(){if(!$('inspector').value.trim()){msg('roundMsg','กรุณากรอกชื่อผู้ตรวจก่อน',true);$('inspector').focus();return false}return true}
    function startScan(){if(!requireName())return;if(!window.Html5QrcodeScanner)return msg('roundMsg','กำลังโหลดเครื่องสแกน กรุณาลองอีกครั้ง',true);$('reader').classList.remove('hidden');$('stopBtn').hidden=false;$('reader').innerHTML='';scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:250,rememberLastUsedCamera:true},false);scanner.render(onScan,()=>{});localizeScanner();$('reader').scrollIntoView({behavior:'smooth'})}
    function localizeScanner(){const root=$('reader');const translate=()=>{root.querySelectorAll('button,a,option,span,div').forEach(n=>{if(n.children.length)return;const t=n.textContent.trim();const map={'Request Camera Permissions':'ขออนุญาตใช้กล้อง','Scan an Image File':'สแกนจากรูปภาพ','Stop Scanning':'หยุดสแกน','Start Scanning':'เริ่มสแกน','Select Camera':'เลือกกล้อง','Camera based scan':'สแกนด้วยกล้อง','File based scan':'สแกนจากไฟล์','Choose Image':'เลือกรูปภาพ'};if(map[t])n.textContent=map[t];else if(t.includes('NotAllowedError'))n.textContent='ไม่สามารถเปิดกล้องได้ กรุณากดขออนุญาตใช้กล้อง และเลือกอนุญาตในโทรศัพท์';else if(t.includes('No cameras found'))n.textContent='ไม่พบกล้องที่ใช้งานได้';});root.querySelectorAll('select').forEach(s=>{if(s.dataset.autoRear)return;const options=[...s.options];const rear=options.find(o=>/back|rear|environment|กล้องหลัง|ด้านหลัง/i.test(o.textContent));if(rear){s.value=rear.value;s.dataset.autoRear='1';s.dispatchEvent(new Event('change',{bubbles:true}));msg('roundMsg','เลือกกล้องหลังให้อัตโนมัติแล้ว')}});};translate();const ob=new MutationObserver(translate);ob.observe(root,{childList:true,subtree:true,characterData:true});setTimeout(()=>ob.disconnect(),30000)}
    async function stopScan(){try{if(scanner)await scanner.clear()}catch(e){}scanner=null;$('reader').innerHTML='';$('reader').classList.add('hidden');$('stopBtn').hidden=true}
    async function onScan(text){rawQr=text;$('query').value=text;await stopScan();findAsset()}
    async function findAsset(){if(!requireName())return;const q=$('query').value.trim();if(!q)return msg('roundMsg','กรุณาสแกนหรือกรอกรหัสครุภัณฑ์',true);busy(true);try{const x=await api({api:'find',q});if(x.existing){asset=null;$('assetCard').classList.add('hidden');return msg('roundMsg','รายการนี้ตรวจแล้ว: '+x.existing.status+' โดย '+x.existing.inspector,true)}asset=x.asset;renderAsset();msg('roundMsg','พบข้อมูลครุภัณฑ์แล้ว')}catch(e){msg('roundMsg',e.message,true)}finally{busy(false)}}
    function renderAsset(){$('assetCard').classList.remove('hidden');$('assetNo').textContent=asset.assetNo||'-';$('assetName').textContent=asset.name||'-';$('assetType').textContent=asset.type||'-';$('sourceStatus').textContent=asset.sourceStatus||'-';$('oldCustodian').textContent=asset.custodian||'-';$('oldGroup').textContent=asset.group||'-';selected=null;$('statuses').innerHTML='';cfg.statuses.forEach(s=>{const b=document.createElement('button');b.className='status';b.style.setProperty('--c',s.color);b.textContent=s.name;b.onclick=()=>selectStatus(s,b);$('statuses').appendChild(b)});$('assetCard').scrollIntoView({behavior:'smooth'})}
    function selectStatus(s,b){selected=s;document.querySelectorAll('.status').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('custodianFields').classList.toggle('hidden',!s.allowCustodian)}
    async function save(){if(!selected)return msg('saveMsg','กรุณาเลือกผลการตรวจ',true),$('saveMsg').classList.remove('hidden');if(selected.noteRequired&&!$('note').value.trim())return msg('saveMsg','สถานะนี้ต้องระบุหมายเหตุ',true),$('saveMsg').classList.remove('hidden');const p={accessCode:'',inspector:$('inspector').value.trim(),assetId:asset.id,assetNo:asset.assetNo,assetName:asset.name,oldCustodian:asset.custodian,oldGroup:asset.group,status:selected.code,newCustodian:$('newCustodian').value.trim(),newGroup:$('newGroup').value.trim(),note:$('note').value.trim(),qrRaw:rawQr||$('query').value.trim()};busy(true);try{const x=await api({api:'save',payload:JSON.stringify(p)});msg('roundMsg',x.message+' เวลา '+x.when);reset()}catch(e){$('saveMsg').classList.remove('hidden');msg('saveMsg',e.message,true)}finally{busy(false)}}
    function reset(){asset=null;selected=null;rawQr='';$('assetCard').classList.add('hidden');$('query').value='';$('note').value='';$('newCustodian').value='';$('newGroup').value='';window.scrollTo({top:0,behavior:'smooth'})}
    $('scanBtn').onclick=startScan;$('stopBtn').onclick=stopScan;$('findBtn').onclick=findAsset;$('saveBtn').onclick=save;$('query').addEventListener('keydown',e=>{if(e.key==='Enter')findAsset()});loadConfig();
  </script>
</body>
</html>
